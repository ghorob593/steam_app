<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Steam App</title>

    <link rel="stylesheet" href="images">
    <link rel="stylesheet" href="noviistyle.css">
    <script src="script.js"></script>
</head>

<header class="header">
        <div class="container header_inner">
            <a href="#" class="logo">
                <span class="logo__icon">S</span>
                <span>STEAM APP</span>
            </a>

            <nav class="nav">
                <a href="#">Home</a>
                <a href="#">Store</a>
                <a href="#">Categories</a>
                <a href="#">Favorites</a>
                <a href="#">About</a>
              </nav>
            <div class="header_actions">
                <input class="search" type="search" placeholder="Search games..." />
                <div class="avatar" title="Profile"></div>
            </div>
        </div>
    </header>
    <section class="game_page">
    <div class="container">

        <div class="game_content">

            <div class="game_image">
                <img id="gameImage" src="" alt="">
            </div>

            <div class="game_description">
                <h1 id="gameTitle">НАЗВА</h1>
                <p id="gameDescription">ОПИС</p>
            </div>

        </div>

        <div class="game_bottom">

            <h1 class="game_title" id="gameName">
                НАЗВА
            </h1>

            <button class="download" id="downloadButton">
                СКАЧАТИ
            </button>

        </div>

    </div>
</section>
